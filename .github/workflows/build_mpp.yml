name: Build patches

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew clean buildAndroid

      - name: Upload patch bundle
        uses: actions/upload-artifact@v7
        with:
          name: piko-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
